; eva24 — palette par fyrr
; basée sur ta palette eva24 (zed / discord system24)
; chaque cle devient une variable css --spice-<cle> utilisable dans user.css
; rappel des roles (cf. doc spicetify) :
;   main          = fond principal de la zone de contenu
;   sidebar       = fond de la barre laterale gauche
;   player        = fond de la barre de lecture en bas
;   card          = fond des cartes (albums, playlists en grille)
;   shadow        = ombre des cartes
;   selected-row  = ligne selectionnee, scrollbar, details playlist
;   button        = fond des boutons (play, like, menus deroulants)
;   button-active = fond du bouton play actif
;   button-disabled = barre de progression et de volume (fond)
;   tab-bar       = fond de la barre d onglets
;   notification  = fond des notifications
;   notification-error = fond des notifications d erreur
;   misc          = divers
;   text          = couleur du texte principal
;   subtext       = texte secondaire (noms playlist sidebar, artistes)

[eva24]
text               = d4d0ea
subtext            = 908caa
sidebar-text       = 6e6a86
main               = 1a1a1a
sidebar            = 1e1e1e
player             = 1a1a1a
card               = 1e1e1e
shadow             = 000000
selected-row       = b487d5
button             = b487d5
button-active      = c9a0e3
button-disabled    = 2a2a2a
tab-bar            = 1e1e1e
notification       = 9ccfd8
notification-error = e6122b
misc               = 403d52
