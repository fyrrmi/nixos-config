# lock screen background: the wallpaper, blurred
background {
    monitor =
    path = ~/code/nixos-config/wallpapers/01-cwb.jpg
    blur_passes = 3       # number of blur passes (more = blurrier)
    blur_size = 7         # strength of each pass
}

# password input field, centered
input-field {
    monitor =
    size = 300, 60
    outline_thickness = 2
    rounding = 0
    dots_center = true                  # center the password dots in the field
    outer_color = rgb(FF8F40)           # border: your theme orange
    inner_color = rgb(1A1D23)           # field background: your theme dark
    font_color = rgb(FFFFFF)            # text / dots color
    fade_on_empty = false
    placeholder_text = <i>password...</i>   # text shown when the field is empty
    position = 0, 0
    halign = center
    valign = center
}
